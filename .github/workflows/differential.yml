name: Differential (beancount v3)

# Diffs this Go engine against the official beancount 3.x reference
# implementation (beanquery) over the curated v3 fixtures and the compliance
# query corpus. This is the correctness gate for the fork: the reference tool
# is the oracle, so every change is checked against real beancount behavior.
#
# (The in-repo Go tests and the byte-parity suite target beancount v2; this
# job covers v3 — what downstream consumers such as cortex/sf-money run.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ~1.25

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install beancount 3.x + beanquery (the v3 oracle)
        run: python -m pip install --upgrade pip beancount beanquery

      - name: Show reference versions
        run: bean-query --version

      - name: Run v3 differential
        run: python3 fidelity/differential.py
